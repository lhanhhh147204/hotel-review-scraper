# pytest.ini (tiếp)
[pytest]
asyncio_mode     = auto
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*
addopts          =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers          =
    asyncio:     async test
    slow:        chạy chậm (bỏ qua với -m "not slow")
    integration: test tích hợp cần DB thật
    unit:        unit test thuần túy
log_cli          = true
log_cli_level    = INFO
log_format       = %(asctime)s [%(levelname)s] %(message)s
log_date_format  = %Y-%m-%d %H:%M:%S